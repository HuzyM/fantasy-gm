name: Frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Python regression and Windows-target type checks
        # Existing private terminal code uses guarded Windows ctypes APIs.
        run: uv run pytest && uv run ruff check src tests && uv run mypy --platform win32
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/verify-browser.mjs
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
          LOCAL_API: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/output/playwright
